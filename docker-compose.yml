services:
  postgres:
    image: postgres:16-alpine
    container_name: login-form-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: login_form_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d login_form_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
